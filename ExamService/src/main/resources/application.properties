spring.application.name=ExamService
server.port=8085

# ==================== Nacos discovery ====================
spring.cloud.nacos.config.import-check.enabled=false
spring.cloud.nacos.discovery.server-addr=169.254.180.49:8848
spring.cloud.nacos.discovery.namespace=public

# ==================== Dubbo consumer ====================
# Users/departments for user picker are consumed from StaffManagement's OrgQueryService via Dubbo (no direct read of sys_* tables).
dubbo.application.name=ExamService
dubbo.registry.address=nacos://169.254.180.49:8848
dubbo.application.qos-enable=false

# ==================== MySQL final_dream ====================
spring.datasource.url=jdbc:mysql://192.168.81.10:3306/final_dream?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
spring.datasource.username=root
spring.datasource.password=${EXAM_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.characterEncoding=utf8
spring.datasource.hikari.data-source-properties.useUnicode=true

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# Reuse the JWT issued by StaffManagement (used only to get the operator for audit fields; no extra auth interception in this module)
exam.auth.jwt-secret=${EXAM_AUTH_JWT_SECRET}

# ==================== Exam local file storage ====================
# Question stem/option/analysis media (video/audio; images go through the rich-text editor) stored on local disk
exam.files.root=${EXAM_FILES_ROOT:D:/JACK/final_dream/.runtime-exam-files}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ==================== Dify「AI出题」工作流（FP-11） ====================
# Dify app 名：测练中心-AI出题 / mode=workflow；
# DSL 文件见 D:\JACK\plan\测练中心题库管理\dify\AI出题.yml（导入 Dify 后在「访问 API」里取 key 填到下面）
exam.dify.base-url=${EXAM_DIFY_BASE_URL:http://10.10.166.13/v1}
exam.dify.ai-gen-api-key=${EXAM_DIFY_AI_GEN_KEY:}
exam.dify.connect-timeout-ms=10000
# 03 §7.1：blocking 调用，最长 120s
exam.dify.read-timeout-ms=120000
# AI 出题首选 AIGentService；改回 dify 并重启才走旧工作流，同一轮不自动降级。
aigent.base-url=${AIGENT_BASE_URL:http://localhost:8086}
agent.exam-gen.provider=${AGENT_EXAM_GEN_PROVIDER:native}
agent.internal-token=${AGENT_INTERNAL_TOKEN:}
# 考试外部加入链接的前端基址（学员端答题页；二维码内容同此串）
exam.arrange.link-base=http://localhost:3000/#/exam/join

# ==================== 变更通知 Outbox Worker（08 §6.1） ====================
# 事务内只写 exam_change_notice + exam_notice_outbox；这里负责把 outbox 投给
# StaffManagement 的通用通知通道（Dubbo NotificationPublishService）。
# 通道不可用时按指数退避重试，不影响考试主流程；只想跑考试主流程时可置 false。
exam.notice.outbox-enabled=${EXAM_NOTICE_OUTBOX_ENABLED:true}
exam.notice.outbox-interval-ms=30000
# 启动后延迟 20s 再首轮扫描，避开 Nacos/Dubbo 就绪窗口
exam.notice.outbox-initial-delay-ms=20000
exam.notice.outbox-batch-size=20
exam.notice.outbox-max-retry=8

# ==================== 管理端首页「平台总览」（平台预览看板 01-需求文档.md §5） ====================
# 允许查询的最大区间天数：超出按上限截断（保留近端 to），响应 range.truncated 置 true。
# 「累计」口径从 2000 年起算必然超限，前端据此提示「统计区间已截断」。
stat.home.max-range-days=${STAT_HOME_MAX_RANGE_DAYS:730}
# 单次返回的最大分桶数：超出返回 40004 参数错误，不静默截断（02-技术实现方案.md §2.3）。
stat.home.series-max-buckets=${STAT_HOME_SERIES_MAX_BUCKETS:400}
