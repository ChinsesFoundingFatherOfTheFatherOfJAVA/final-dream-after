spring.application.name=StaffManagement
server.port=8083

# ==================== Nacos discovery ====================
# 与 AtualCombatTraining 保持同一个注册中心地址
spring.cloud.nacos.config.import-check.enabled=false
spring.cloud.nacos.discovery.server-addr=169.254.180.49:8848
spring.cloud.nacos.discovery.namespace=public

# ==================== MySQL：用户与权限中心（主数据源） ====================
# 与 SpeechTraining / AtualCombatTraining 同库；sys_* 表见 sql/v2.0-用户与权限-建表.sql
# 前缀是 sm.mysql 而不是 spring.datasource：Oracle 数据源也在本进程内，
# 两个 DataSource Bean 一旦手动声明，Boot 的自动装配就整体退让（见 DataSourceConfig）
# forceConnectionTimeZoneToSession 是必须的：这台实例 @@system_time_zone=UTC，
# 建表 DDL 里的 created_at DEFAULT CURRENT_TIMESTAMP 会写 UTC 墙上时间，
# 而 Java 侧 LocalDateTime.now() 是东八区——同一张表里两套时钟差 8 小时。
# 连上会话即 SET time_zone='+08:00'，让库侧默认值和 Java 写进去的值口径一致。
sm.mysql.jdbc-url=jdbc:mysql://192.168.81.10:3306/final_dream?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
sm.mysql.username=root
sm.mysql.password=${SM_MYSQL_PASSWORD}
sm.mysql.driver-class-name=com.mysql.cj.jdbc.Driver
sm.mysql.pool-name=sm-mysql
sm.mysql.maximum-pool-size=10
sm.mysql.minimum-idle=2
sm.mysql.connection-timeout=10000
# 同步任务一轮要写 3.4 万行，给足超时但不要无限挂着
sm.mysql.max-lifetime=1800000

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# ==================== Oracle SHR 员工视图（只读次数据源） ====================
# 注意 schema：连接账号是 JACKSHRORGUSER，视图挂在 JACKSHR 下，SQL 里必须带 JACKSHR. 前缀
sm.oracle.jdbc-url=jdbc:oracle:thin:@//shrdb.chinajack.local:1521/ORCL
sm.oracle.username=JACKSHRORGUSER
sm.oracle.password=${SM_ORACLE_PASSWORD:}
sm.oracle.driver-class-name=oracle.jdbc.OracleDriver
# 视图单查 2~3 秒，池子不必大，够用且不给 Oracle 压力
sm.oracle.pool-name=sm-oracle
sm.oracle.maximum-pool-size=8
sm.oracle.minimum-idle=0
sm.oracle.connection-timeout=10000

# ==================== Redis：部门目录缓存 ====================
# 该实例没有配 requirepass，写密码反而会被服务端拒绝
spring.data.redis.host=192.168.81.10
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms
spring.data.redis.connect-timeout=3000ms

# ==================== 认证与口令（FP-20 等） ====================
# jwt-secret 是 HS256 密钥，UTF-8 字节需 >= 32；换密钥即让全部在线 token 失效
sm.auth.jwt-secret=${SM_AUTH_JWT_SECRET}
sm.auth.jwt-expire-hours=12
# 全员默认密码：同步新建用户与"重置密码"都恢复到这个值（BCrypt 入库）
sm.auth.default-password=${SM_AUTH_DEFAULT_PASSWORD}
# 内置超级管理员，启动时 seeding，不可被禁用/删除/取消超管
sm.auth.admin-account=admin
sm.auth.admin-initial-password=${SM_AUTH_ADMIN_INITIAL_PASSWORD}

# ==================== Oracle 同步任务（FP-17） ====================
# cron 默认每晚 2 点增量；全量只在首次上线时手动触发（POST /api/sm/admin/sync/trigger?full=true）
sm.sync.cron=0 0 2 * * ?
sm.sync.batch-size=500
# 首轮全量必须由人盯着手动跑（一次性写 3.4 万行进共享库），跑通后再改回 true 打开每晚增量。
# 默认 false 还有个作用：本地/联调实例不会因为到了点就把测试库当生产库刷。
sm.sync.enabled=false

# ==================== Dubbo 服务提供者 ====================
dubbo.application.name=StaffManagement
dubbo.protocol.name=dubbo
# 20880/22222 被本机 dubbo-spike 占着，这里固定用 20881/22223
dubbo.protocol.port=20881
dubbo.application.qos-port=22223
dubbo.registry.address=nacos://169.254.180.49:8848
# 两个包都要扫：遗留的 service/impl 与新收敛的 notification/service（@DubboService）
dubbo.scan.base-packages=jack.digityhuman.staffmanagement.service,jack.digityhuman.staffmanagement.notification.service
# 只做接口级注册。应用级注册会用 StaffManagement 这个服务名往 Nacos 再写一个实例，
# 端口是 20881 而不是 8083；网关按服务名做负载均衡时就会把 HTTP 流量打到 Dubbo 端口上。
dubbo.application.register-mode=interface
