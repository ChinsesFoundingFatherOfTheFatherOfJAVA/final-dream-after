spring.application.name=OnlineClassroom
server.port=8084

# ==================== Nacos discovery ====================
spring.cloud.nacos.config.import-check.enabled=false
spring.cloud.nacos.discovery.server-addr=169.254.180.49:8848
spring.cloud.nacos.discovery.namespace=public

# ==================== Dubbo 消费者 ====================
# 用户/部门/角色/权限统计经 Dubbo 调 StaffManagement 的 OrgQueryService，不再直读 sys_* 表。
# registry 与上面的 nacos discovery 同一实例；本进程不提供服务，关掉 QoS 避免多个本地应用抢 22222 端口。
dubbo.application.name=OnlineClassroom
dubbo.registry.address=nacos://169.254.180.49:8848
dubbo.application.qos-enable=false

# ==================== MySQL final_dream ====================
spring.datasource.url=jdbc:mysql://10.100.26.200:3306/final_dream?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&forceConnectionTimeZoneToSession=true
spring.datasource.username=root
spring.datasource.password=${KNG_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.characterEncoding=utf8
spring.datasource.hikari.data-source-properties.useUnicode=true

mybatis-plus.configuration.map-underscore-to-camel-case=true
# 显式补上（AGENTS §4 待办）：新增 KngMediaJobMapper.xml 后不依赖 MP 默认值才能加载
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml

# 复用 StaffManagement 签发的 JWT，仅用于取得创建人/更新人；本模块不做额外鉴权拦截
kng.auth.jwt-secret=${KNG_AUTH_JWT_SECRET}

# ==================== KNG local file storage ====================
kng.upload.dir=${KNG_UPLOAD_DIR:D:/JACK/final_dream/.runtime-kng-files}
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB

# ==================== 媒体处理（AI字幕与转码专项） ====================
# ffmpeg/ffprobe 通过 PATH 查找（部署机须安装 LGPL 构建，PoC-1 核查许可）；单任务看门狗
media.ffmpeg.timeout-minutes=${MEDIA_FFMPEG_TIMEOUT_MINUTES:60}
# worker 并发上限（同时处理的 job 数）
media.worker.concurrency=${MEDIA_WORKER_CONCURRENCY:2}
# OSS（字幕管线 wav 临时上传用；不开通则字幕功能不可用、转码不受影响）
# 敏感项待迁移 Nacos（plan/待办-敏感信息迁移Nacos配置中心并清洗git历史.md），迁移后此处回退占位
media.oss.endpoint=${MEDIA_OSS_ENDPOINT:}
media.oss.bucket=${MEDIA_OSS_BUCKET:}
media.oss.access-key-id=${MEDIA_OSS_ACCESS_KEY_ID:}
media.oss.access-key-secret=${MEDIA_OSS_ACCESS_KEY_SECRET:}
# QwenAI platform ASR (default paraformer-v2, switchable to fun-asr) & qwen translation.
# Platform switched from Bailian (arrears) to QwenAI maas on 10-08; account/vocabulary data shared.
media.asr.model=${MEDIA_ASR_MODEL:paraformer-v2}
media.asr.api-key=${MEDIA_ASR_API_KEY:}
# DashScope SDK global base url override (empty = SDK default dashscope.aliyuncs.com)
media.asr.base-url=${MEDIA_ASR_BASE_URL:https://maas.qianwenaiapi.com/api/v1}
# Hot-word vocabulary id (empty = disabled); must match target_model of the vocabulary
media.asr.vocabulary-id=${MEDIA_ASR_VOCABULARY_ID:vocab-kng-2ca5d66301134ad9b280837fbe5f4b5f}
media.translate.model=${MEDIA_TRANSLATE_MODEL:qwen-flash}
media.translate.api-key=${MEDIA_TRANSLATE_API_KEY:}
# OpenAI-compatible base url (code appends /chat/completions if missing)
media.translate.base-url=${MEDIA_TRANSLATE_BASE_URL:https://maas.qianwenaiapi.com/compatible-mode/v1}
