# ==================== v1.1 Speech & Avatar ====================
# DashScope (Aliyun Bailian) API key for TTS/ASR
dashscope.api-key=***REMOVED***
# TTS: CosyVoice v2; default voice when virtual_trainer.voice_id is empty
speech.tts.model=cosyvoice-v3-flash
speech.tts.default-voice=longwan_v2
# ASR: mandarin=paraformer-v2, cantonese=paraformer-cantonese
speech.asr.model=paraformer-v2
speech.asr.cantonese-model=paraformer-cantonese
voice.map.[\u6e29\u67d4\u5973\u58f0]=longwan_v2
voice.map.[\u6c89\u7a33\u7537\u58f0]=longcheng_v2
voice.map.[\u4eb2\u5207\u5973\u58f0]=longxiaochun_v2
# Admin dropdown placeholder voice ids (EditProject.vue) -> DashScope voices:
#   voice1 = gentle female, voice2 = mature male, voice3 = lively female
voice.map.voice1=longwan_v2
voice.map.voice2=longcheng_v2
voice.map.voice3=longxiaoxia_v2
# Audio / avatar storage dirs and URL prefixes (same rules as cover image)
app.upload.audio-dir=/audio
app.upload.audio-url-prefix=/audio
app.upload.avatar-dir=/avatar
app.upload.avatar-url-prefix=/avatar
