# ==================== Dubbo 消费者 ====================
# 用户/部门/角色/权限经 Dubbo 调 StaffManagement 的 OrgQueryService，不再直读 sys_* 表。
# registry 与上面的 nacos discovery 同一实例；本进程不提供服务，关掉 QoS 避免多个本地应用抢 22222 端口。
dubbo.application.name=SpeechTraining
dubbo.registry.address=nacos://169.254.180.49:8848
dubbo.application.qos-enable=false

# 与 StaffManagement 共用登录态；生产环境必须覆盖密钥并关闭开发回落
speech.auth.jwt-secret=${SPEECH_AUTH_JWT_SECRET:***REMOVED***}
speech.auth.dev-fallback-enabled=${SPEECH_AUTH_DEV_FALLBACK_ENABLED:true}

# ==================== File upload ====================
# Cover image storage dir and URL prefix
app.upload.cover-image-dir=/coverImage
app.upload.cover-image-url-prefix=/coverImage
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ==================== v1.1 Speech & Avatar ====================
# DashScope (Aliyun ??AI??) API key —— TTS 与语气评分使用
dashscope.api-key=***REMOVED***
# Tone scoring via ??AI?? qwen3.8-omni-flash (PoC validated 2026-09-24)
speech.tone.enabled=true
speech.tone.base-url=https://maas.qianwenaiapi.com/compatible-mode/v1
speech.tone.model=qwen3.8-omni-flash
speech.tone.api-key=${dashscope.api-key}
speech.tone.read-timeout-ms=60000
speech.tone.concurrency=3
# TTS: CosyVoice v2; default voice when virtual_trainer.voice_id is empty
# 模型必须与下面 voice.map 的音色后缀同代：v3 系列模型不认 *_v2 音色，
# 合成会以引擎 418 InvalidParameter 失败（SDK 同步调用只返回 null，错误被吞）
speech.tts.model=cosyvoice-v2
speech.tts.default-voice=longwan_v2
# ---- ASR：豆包流式语音识别（SAUC v3 二进制 WebSocket 协议），替换原阿里百炼 Paraformer ----
# endpoint 说明见 DoubaoAsrProperties；bigmodel_async 是唯一支持 enable-nonstream（二遍识别）的链路
speech.asr.doubao.url=wss://openspeech.bytedance.com/api/v3/sauc/bigmodel_async
speech.asr.doubao.app-key=***REMOVED***
speech.asr.doubao.access-key=***REMOVED***
speech.asr.doubao.resource-id=volc.seedasr.sauc.duration
speech.asr.doubao.model-name=bigmodel
speech.asr.doubao.enable-nonstream=true
# 语种检测：响应里带回 lid_lang（粤语=speech_dia_cant），用于核验方言语种
speech.asr.doubao.enable-lid=true
speech.asr.doubao.chunk-ms=200
# 整段上传场景实测 0 间隔即可（7s 音频约 2s 返回）；若出现等包异常再调大到 100~200
speech.asr.doubao.chunk-interval-ms=0
# 只覆盖"最后一个音频包发出后到终结结果"的等待（真人语音实测 <1s）；
# 无语音内容时服务端不再回包，本值即学员干等时长，故取 10s 而非 30s
speech.asr.doubao.timeout-seconds=10
voice.map.[\u6e29\u67d4\u5973\u58f0]=longwan_v2
voice.map.[\u6c89\u7a33\u7537\u58f0]=longcheng_v2
voice.map.[\u4eb2\u5207\u5973\u58f0]=longxiaochun_v2
# Admin dropdown placeholder voice ids (EditProject.vue) -> DashScope voices:
#   voice1 = gentle female, voice2 = mature male, voice3 = lively female
voice.map.voice1=longwan_v2
voice.map.voice2=longcheng_v2
voice.map.voice3=longxiaoxia_v2
# Audio / avatar storage dirs and URL prefixes (same rules as cover image)
app.upload.audio-dir=/audio
app.upload.audio-url-prefix=/audio
app.upload.avatar-dir=/avatar
app.upload.avatar-url-prefix=/avatar

