spring.application.name=AtualCombatTraining
server.port=8082
# ==================== Nacos discovery ====================
spring.cloud.nacos.config.import-check.enabled=false
spring.cloud.nacos.discovery.server-addr=169.254.180.49:8848
spring.cloud.nacos.discovery.namespace=public
# ==================== MySQL final_dream ====================
spring.datasource.url=jdbc:mysql://10.100.26.200:3306/final_dream?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=${ACT_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.characterEncoding=utf8
spring.datasource.hikari.data-source-properties.useUnicode=true
# ==================== MyBatis-Plus ====================
mybatis-plus.configuration.map-underscore-to-camel-case=true
# ==================== Dify (self-hosted 1.10.1) ====================
# Orchestrator Agent + theme-gen workflow + case-gen workflow API keys (fill after DSL import)
dify.base-url=http://10.10.166.13/v1
dify.orchestrator-key=${ACT_DIFY_ORCHESTRATOR_KEY:}
dify.theme-gen-key=${ACT_DIFY_THEME_GEN_KEY:}
dify.case-gen-key=${ACT_DIFY_CASE_GEN_KEY:}
# Dify runs on a private (intranet) host: the outbound URL guard blocks private/loopback
# addresses by default, so this on-prem deployment must opt in explicitly.
dify.allow-private-host=true
dify.connect-timeout-ms=10000
# orchestrator streaming read timeout (SSE)
dify.agent-timeout-ms=300000
# workflow blocking timeouts: theme generation / single case generation
dify.theme-timeout-ms=600000
dify.case-timeout-ms=120000
# ==================== Agent runtime provider ====================
# dify = 原平台编排 fallback；native = AIGentService 内部 ReAct runtime
agent.chat.provider=${ACT_AGENT_CHAT_PROVIDER:native}
agent.chat.native.base-url=${ACT_AGENT_NATIVE_BASE_URL:http://localhost:8086}
agent.chat.native.connect-timeout-ms=10000
agent.chat.native.timeout-ms=300000
agent.internal-token=${AGENT_INTERNAL_TOKEN:}
agent.internal-auth.enabled=${AGENT_INTERNAL_AUTH_ENABLED:true}
# P2 workflow provider + AIGentService task base
aigent.base-url=${AIGENT_BASE_URL:http://localhost:8086}
agent.theme-gen.provider=${AGENT_THEME_GEN_PROVIDER:native}
agent.case-gen.provider=${AGENT_CASE_GEN_PROVIDER:native}
# ==================== AI assistant module ====================
# uploaded material storage dir (relative to process working dir)
assistant.file-dir=./act-files/
assistant.file-max-size-bytes=52428800
# Spring multipart limits must match assistant.file-max-size-bytes, otherwise the container rejects
# the request before our own size check runs (default is 1MB per file, which breaks 2.6MB pptx uploads).
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# material parsing executor (local Tika extraction; must NOT share the generation pool,
# otherwise a 150~600s theme/case generation job delays upload parsing by tens of minutes)
assistant.parse-pool.core=2
assistant.parse-pool.max=4
assistant.parse-pool.queue=64
# generation executor (theme + case generation tasks)
assistant.generate-pool.core=2
assistant.generate-pool.max=4
assistant.generate-pool.queue=64
# publish initialization executor (drill-script compiling)
assistant.publish-pool.core=2
assistant.publish-pool.max=4
assistant.publish-pool.queue=128
# websocket heartbeat: server sends ping every 20s, closes when no pong within 80s
assistant.ws.ping-interval-ms=20000
assistant.ws.pong-timeout-ms=80000
# inbound chat frames run on their own threads (one chat round blocks on the whole Dify SSE
# stream); on the container read thread they would starve pong reading and get killed by the
# heartbeat above. Per-session frames stay serialized, so pool size = sessions handled at once.
assistant.ws.inbound-pool-size=8
assistant.ws.inbound-queue-per-session=20
# ==================== DashScope ASR (Bailian Paraformer) ====================
# reuse the same DashScope credential as SpeechTraining; env var override supported
dashscope.api-key=${ACT_DASHSCOPE_API_KEY:}
assistant.asr.model=paraformer-v2
