spring.application.name=AIGentService
server.port=8086

# Native free-practice runtime: Qwen compatible endpoint.
agent.qwen.base-url=https://maas.qianwenaiapi.com/compatible-mode/v1
agent.qwen.api-key=${SPEECH_DASHSCOPE_API_KEY:}
agent.qwen.model=qwen3.8-flash
agent.qwen.max-tokens=3000
agent.qwen.temperature=0.3
agent.qwen.top-p=0.3
agent.qwen.connect-timeout-ms=10000
agent.qwen.read-timeout-ms=120000
agent.react.max-iterations=80

# Internal tools remain in AtualCombatTraining; AIGentService only calls their HTTP adapters.
agent.tools.base-url=http://localhost:8082
agent.tools.connect-timeout-ms=5000
agent.tools.read-timeout-ms=120000
