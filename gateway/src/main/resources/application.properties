spring.application.name=gateway
server.port=8080
spring.cloud.nacos.config.import-check.enabled=false
# ==================== Nacos 服务发现 ====================
spring.cloud.nacos.discovery.server-addr=169.254.180.49:8848
spring.cloud.nacos.discovery.namespace=public

# ==================== 路由配置 ====================
spring.cloud.gateway.server.webmvc.routes[0].id=speech-training
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://SpeechTraining
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/**
