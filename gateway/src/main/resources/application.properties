spring.application.name=gateway
server.port=8080
spring.cloud.nacos.config.import-check.enabled=false

# ==================== 边缘鉴权（2026-10-02 起） ====================
# 在 /api/* 进入任何业务应用之前校验 StaffManagement 签发的 HS256 JWT。
# 密钥与 sm.auth.jwt-secret 同值；生产用环境变量注入，本地默认值仅用于开发联调。
gateway.auth.enabled=${GATEWAY_AUTH_ENABLED:true}
gateway.auth.jwt-secret=${GATEWAY_AUTH_JWT_SECRET}
# 免鉴权路径：登录（无 token 可言）、Dify 编排 Agent 内网工具回调（调用方无用户态）、
# 在线课堂课件文件流（video/audio 标签拉流带不了 Authorization 头；收紧需前端改 fetch+blob）
gateway.auth.whitelist[0]=/api/sm/auth/login
gateway.auth.whitelist[1]=/api/act/internal/tools/**
gateway.auth.whitelist[2]=/api/kng-files/**
# Exam static media files (same as kng-files: audio/video elements cannot carry the Authorization header)
gateway.auth.whitelist[6]=/api/exam/files/**
# SpeechTraining static resources (audio/cover/avatar: browser audio/img elements do not carry the Authorization header, same precedent as kng-files)
gateway.auth.whitelist[3]=/api/audio/**
gateway.auth.whitelist[4]=/api/coverImage/**
gateway.auth.whitelist[5]=/api/avatar/**

# ==================== Nacos 服务发现 ====================
spring.cloud.nacos.discovery.server-addr=169.254.180.49:8848
spring.cloud.nacos.discovery.namespace=public

# ==================== 路由配置 ====================
# route[0] actual-combat-training: must be declared BEFORE the /api/** wildcard route
spring.cloud.gateway.server.webmvc.routes[0].id=actual-combat-training
spring.cloud.gateway.server.webmvc.routes[0].order=-2
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://AtualCombatTraining
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/act/**
# route[1] speech-training: original route, unchanged content
# staff-management: declare before the /api/** wildcard route
spring.cloud.gateway.server.webmvc.routes[1].id=staff-management
spring.cloud.gateway.server.webmvc.routes[1].order=-1
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://StaffManagement
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/sm/**
# route[2] online-classroom: must be declared before /api/** wildcard
spring.cloud.gateway.server.webmvc.routes[2].id=online-classroom
spring.cloud.gateway.server.webmvc.routes[2].order=-1
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://OnlineClassroom
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/kng/**
spring.cloud.gateway.server.webmvc.routes[3].id=online-classroom-files
spring.cloud.gateway.server.webmvc.routes[3].order=-1
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://OnlineClassroom
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/kng-files/**
# route[4] exam-service: question bank management
# 必须显式排在下面的 /api/** 通配路由之前：Spring Cloud Gateway Server WebMVC 按声明顺序匹配，
# 只靠 order 不生效；一旦排在通配路由之后，/api/exam/** 会被 SpeechTraining 接走，前端表现为"接口不存在"。
spring.cloud.gateway.server.webmvc.routes[4].id=exam-service
spring.cloud.gateway.server.webmvc.routes[4].order=-1
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://ExamService
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/exam/**
# route[5] speech-training wildcard fallback (必须最后声明)
spring.cloud.gateway.server.webmvc.routes[5].id=speech-training
spring.cloud.gateway.server.webmvc.routes[5].order=0
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://SpeechTraining
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/**
